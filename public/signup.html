<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>AskAnswer — регистрация</title>

    <link rel="stylesheet" href="static/css/style.css">
    <link rel="icon"
      href="static/img/favicon.svg"
      type="image/svg+xml">
</head>

<body>

    <!-- Шапка сайта -->
    <header class="site-header">
        <div class="header-inner">

            <a href="index.html" class="logo">
                AskAnswer
            </a>

            <form class="header-search" action="index.html" method="get">
                <input
                    type="search"
                    name="q"
                    placeholder="Поиск вопросов..."
                    aria-label="Поиск вопросов">
            </form>

            <a href="ask.html" class="button button-ask">
                ASK!
            </a>

            <div class="user-block">
                <a href="login.html" class="button button-login">
                    Войти
                </a>

                <a href="signup.html" class = "button button-signup">
                    Регистрация
                </a>

            </div>

        </div>
    </header>

    <!-- Основная область сайта -->
    <div class="page-layout">

        <main class="main-content">

    <section class="auth-page">

        <h1>Регистрация</h1>

        <p class="auth-description">
            Создайте аккаунт, чтобы задавать вопросы
            и помогать другим пользователям.
        </p>

        <form class="auth-form">

            <!-- Имя пользователя -->
            <div class="form-group">

                <label for="username">
                    Имя пользователя
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Введите имя пользователя"
                    required>

            </div>

            <!-- Электронная почта -->
            <div class="form-group">

                <label for="email">
                    Электронная почта
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="example@mail.com"
                    required>

            </div>

            <!-- Пароль -->
            <div class="form-group">

                <label for="password">
                    Пароль
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Придумайте пароль"
                    required>

            </div>

            <!-- Подтверждение пароля -->
            <div class="form-group">

                <label for="password-confirm">
                    Повторите пароль
                </label>

                <input
                    type="password"
                    id="password-confirm"
                    name="password-confirm"
                    placeholder="Повторите пароль"
                    required>

            </div>

            <!-- Согласие с условиями -->
            <div class="registration-options">

                <label>
                    <input type="checkbox" name="agreement" required>
                    Я согласен с условиями использования
                </label>

            </div>

            <!-- Кнопка регистрации -->
            <button type="button" class="button button-ask">
                Зарегистрироваться
            </button>

            <p class="auth-registration">
                Уже есть аккаунт?
                <a href="login.html">Войти</a>
            </p>

        </form>

    </section>

</main>

        <!-- Боковая панель -->
        <aside class="sidebar">

            <section class="sidebar-section">
                <h3> Популярные теги </h3>

                <ul>
                    <li><a href="#">HTML</a></li>
                    <li><a href="#">CSS</a></li>
                    <li><a href="#">Python</a></li>
                </ul>
            </section>

            <section class="sidebar-section members">
                <h4> Лучшие участники </h4>

                <ul>
                    <li><a href="#">Mr. Freeman</a></li>
                    <li><a href="#">Dr. Who</a></li>
                    <li><a href="#">Ben</a></li>
                </ul>
            </section>
        </aside>

    </div>

    <!-- Подвал сайта -->
    <footer class="site-footer">
        <div class="footer-inner">
            <p> © 2026 AskAnswer — вопросы и ответы </p>
        </div>
    </footer>

</body>
</html>
