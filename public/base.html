<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>AskAnswer — вопросы и ответы</title>

    <link rel="stylesheet" href="static/css/style.css">
    <link rel="icon"
      href="static/img/favicon.svg"
      type="image/svg+xml">
</head>

<body>

    <!-- Шапка сайта -->
    <header class="site-header">
        <div class="header-inner">

            <a href="index.html" class="logo">
                AskAnswer
            </a>

            <form class="header-search" action="index.html" method="get">
                <input
                    type="search"
                    name="q"
                    placeholder="Поиск вопросов..."
                    aria-label="Поиск вопросов">
            </form>

            <a href="ask.html" class="button button-ask">
                ASK!
            </a>

            <div class="user-block">
                <a href="login.html" class="button button-login">
                    Войти
                </a>

                <a href="signup.html" class = "button button-signup">
                    Регистрация
                </a>

            </div>

        </div>
    </header>

    <!-- Основная область сайта -->
    <div class="page-layout">

        <main class="main-content">
            <h2> Новые вопросы </h2>

            <p>
            Список вопросов
            </p>
        </main>

        <!-- Боковая панель -->
        <aside class="sidebar">

            <section class="sidebar-section">
                <h3> Популярные теги </h3>

                <ul>
                    <li><a href="#">HTML</a></li>
                    <li><a href="#">CSS</a></li>
                    <li><a href="#">Python</a></li>
                </ul>
            </section>

            <section class="sidebar-section members">
                <h4> Лучшие участники </h4>

                <ul>
                    <li><a href="#">Mr. Freeman</a></li>
                    <li><a href="#">Dr. Who</a></li>
                    <li><a href="#">Ben</a></li>
                </ul>
            </section>
        </aside>

    </div>

    <!-- Подвал сайта -->
    <footer class="site-footer">
        <div class="footer-inner">
            <p> © 2026 AskAnswer — вопросы и ответы </p>
        </div>
    </footer>

</body>
</html>
