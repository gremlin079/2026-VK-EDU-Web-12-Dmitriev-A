{% extends 'base.html' %}

{% block title %}Вход — AskAnswer{% endblock %}

{% block content %}
    <section class="auth-page">
        <h1>Вход в аккаунт</h1>
        <p class="auth-description">Войдите, чтобы задавать вопросы и помогать другим пользователям.</p>

        <form class="auth-form">
            <div class="form-group">
                <label for="email">Электронная почта</label>
                <input type="email" id="email" name="email" placeholder="example@mail.com" required>
            </div>

            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" placeholder="Введите пароль" required>
            </div>

            <div class="auth-options">
                <label class="remember-label">
                    <input type="checkbox" name="remember">
                    Запомнить меня
                </label>
                <a href="#">Забыли пароль?</a>
            </div>

            <button type="button" class="button button-ask">Войти</button>
            <p class="auth-registration">
                Нет аккаунта?
                <a href="{% url 'signup' %}">Зарегистрироваться</a>
            </p>
        </form>
    </section>
{% endblock %}
